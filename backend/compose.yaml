services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bridgepdx_dev
      POSTGRES_USER: bridgepdx_dev
      POSTGRES_PASSWORD: development_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - bridgepdx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgepdx_dev -d bridgepdx_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  bridgepdx_postgres_data:
